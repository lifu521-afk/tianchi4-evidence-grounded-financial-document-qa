[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tianchi-long-document-qa"
version = "0.1.0"
description = "Evidence-grounded Qwen agent for long-document QA competitions"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11,<1",
    "pypdf>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["agent*"]
exclude = ["tests*", "script*", "docs*"]
namespaces = false
